# Railway configuration for the SigNoz UI service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "signoz/Dockerfile.signoz"

[deploy]
startCommand = "./signoz"
healthcheckPath = "/api/v1/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
sleepApplication = true

[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1
