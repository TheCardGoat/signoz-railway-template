# Railway configuration for the SigNoz OpenTelemetry collector service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "signoz/Dockerfile.otel"

[deploy]
startCommand = "/bin/sh -c \"/signoz-otel-collector migrate sync check && exec /signoz-otel-collector --config=/etc/otel-collector-config-postgres.yaml --copy-path=/var/tmp/collector-config.yaml\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
sleepApplication = false

[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1

