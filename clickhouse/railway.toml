# Railway configuration for the SigNoz ClickHouse service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "clickhouse/Dockerfile.clickhouse"

[deploy]
healthcheckPath = "/ping"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
sleepApplication = false

[deploy.multiRegionConfig.us-east4-eqdc4a]
numReplicas = 1

